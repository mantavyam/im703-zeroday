  #   race_page: im-frankfurt
  #   year: 2028
  #   race_months: [6, 7]
  #   watch_from: 2027-06-28
  #   active: true
  #   timezone: Europe/Berlin
  #   competitions: []
  #   aliases:
  #     enabled: true
  #     pages: []
  #     slugs: ["{year}-ironman-frankfurt-european-championship"]
