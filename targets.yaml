# Races to watch. One entry = one race edition you want to register for.
#
# The watcher runs for each active target from `watch_from` until that
# edition is sold out (or registration closes). Then the target is marked
# done. When every active target is done, the workflow turns itself off.
# To watch something new later: add a target and re-enable the workflow
# (Actions tab -> watch -> "Enable workflow").

targets:
  - id: goa-2027
    name: IRONMAN 70.3 Goa 2027
    race_page: im703-goa          # from https://www.ironman.com/races/<race_page>/register
    year: 2027                    # edition year you want
    race_months: [10, 11]         # race usually held in Oct/Nov; used to sanity-check the edition
    watch_from: 2026-11-02        # start watching on this date (day after the 2026 race)
    active: true
    # Only these entry types decide "sold out" and tier alerts.
    # Matched case-insensitively against Njuko competition names.
    # Use [] to track every entry type.
    competitions: ["Individual Entry"]
    tier_alert_pct: 80            # alert when the current price tier is this % full
    extra_slugs: []               # extra Njuko slugs to try, if Ironman uses an odd one

  # Amdavad's inaugural race is 14 Feb 2027; start watching for the 2028
  # edition the day after. Njuko slug expected: 2028-ironman-703-amdavad.
  - id: amdavad-2028
    name: IRONMAN 70.3 Amdavad 2028
    race_page: im703-amdavad
    year: 2028
    race_months: [1, 2, 3]        # 2027 race was in Feb; allow a month either side
    watch_from: 2027-02-15        # day after the 2027 race
    active: true
    competitions: ["Individual Entry"]
    tier_alert_pct: 80
    extra_slugs: []
